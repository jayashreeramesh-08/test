<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruity Paradise 🌈</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --neon-pink: #ff2d78;
  --neon-yellow: #ffe600;
  --neon-green: #00ff88;
  --neon-blue: #00cfff;
  --neon-purple: #bf5fff;
  --neon-orange: #ff7043;
}

body {
  font-family: 'Nunito', sans-serif;
  background: #0a0a1a;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: none;
}

/* Custom cursor */
.cursor {
  width: 20px; height: 20px;
  background: radial-gradient(circle, #fff, var(--neon-pink));
  border-radius: 50%;
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
  mix-blend-mode: screen;
}
.cursor-trail {
  width: 8px; height: 8px;
  background: var(--neon-blue);
  border-radius: 50%;
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  opacity: 0.6;
  transition: all 0.25s ease;
  mix-blend-mode: screen;
}

/* Stars */
.stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.star {
  position: absolute; background: white; border-radius: 50%;
  animation: twinkle var(--t) ease-in-out infinite alternate;
}
@keyframes twinkle { 0%{opacity:0.1;transform:scale(0.8)} 100%{opacity:1;transform:scale(1.2)} }

/* Header */
header {
  position: relative; z-index: 10;
  text-align: center;
  padding: 50px 20px 10px;
}
.header-glow {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  width: 400px; height: 120px;
  background: radial-gradient(ellipse, rgba(255,45,120,0.4) 0%, transparent 70%);
  pointer-events: none; z-index: -1;
  animation: pulseGlow 2s ease-in-out infinite alternate;
}
@keyframes pulseGlow { 0%{opacity:0.5} 100%{opacity:1;width:500px} }

h1 {
  font-family: 'Righteous', cursive;
  font-size: clamp(2.8rem, 8vw, 5rem);
  background: linear-gradient(90deg, #ff2d78, #ffe600, #00ff88, #00cfff, #bf5fff, #ff7043);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: rainbowShift 3s linear infinite, titleDrop 1s cubic-bezier(0.175,0.885,0.32,1.275) both;
  letter-spacing: 2px;
}
@keyframes rainbowShift { 0%{background-position:0%} 100%{background-position:300%} }
@keyframes titleDrop { 0%{opacity:0;transform:translateY(-60px) scale(1.3)} 100%{opacity:1;transform:translateY(0) scale(1)} }

.tagline {
  margin-top: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* Marquee ticker */
.ticker-wrap {
  margin: 24px 0 0;
  overflow: hidden;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
  padding: 10px 0;
  position: relative; z-index: 10;
}
.ticker {
  display: flex; gap: 60px;
  animation: tickerScroll 20s linear infinite;
  white-space: nowrap;
}
@keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker span { color: white; font-weight: 900; font-size: 0.85rem; letter-spacing: 2px; }
.ticker span::before { content: "✦ "; }

/* Mood selector */
.mood-bar {
  position: relative; z-index: 10;
  display: flex; justify-content: center; gap: 12px;
  margin: 30px 20px 0;
  flex-wrap: wrap;
}
.mood-btn {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  padding: 8px 20px;
  border-radius: 50px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
}
.mood-btn:hover, .mood-btn.active {
  background: var(--c);
  border-color: var(--c);
  color: #000;
  transform: scale(1.08);
  box-shadow: 0 0 20px var(--c);
}

/* Fruit grid */
.shop-section {
  position: relative; z-index: 10;
  max-width: 1100px; margin: 36px auto 0; padding: 0 20px;
}
.grid-label {
  color: rgba(255,255,255,0.3);
  font-size: 0.75rem; font-weight: 800;
  letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 20px;
}
.fruit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 20px;
}

.fruit-card {
  position: relative;
  border-radius: 28px;
  padding: 30px 18px 22px;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.4s;
  animation: cardRise 0.7s cubic-bezier(0.175,0.885,0.32,1.275) both;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
}

.fruit-card::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  opacity: 0.12;
  transition: opacity 0.3s;
  border-radius: 28px;
}
.fruit-card:hover::before { opacity: 0.25; }

.fruit-card::after {
  content:'';
  position:absolute;
  top: -60%; left: -60%;
  width: 80%; height: 80%;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  border-radius: 50%;
  transition: all 0.5s;
  pointer-events: none;
}
.fruit-card:hover::after { top:-20%; left:-20%; }

@keyframes cardRise {
  0%{opacity:0;transform:translateY(50px) rotate(-3deg)}
  100%{opacity:1;transform:translateY(0) rotate(0deg)}
}
.fruit-card:nth-child(1){animation-delay:.05s}
.fruit-card:nth-child(2){animation-delay:.1s}
.fruit-card:nth-child(3){animation-delay:.15s}
.fruit-card:nth-child(4){animation-delay:.2s}
.fruit-card:nth-child(5){animation-delay:.25s}
.fruit-card:nth-child(6){animation-delay:.3s}

.fruit-card:hover {
  transform: translateY(-12px) scale(1.04) rotate(1deg);
  box-shadow: 0 20px 60px var(--shadow), 0 0 0 1px var(--c1);
}

/* Glow border animation */
.glow-ring {
  position:absolute; inset:-1px;
  border-radius: 28px;
  padding:1px;
  background: linear-gradient(var(--angle, 0deg), var(--c1), var(--c2), var(--c1));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s;
  animation: rotateAngle 3s linear infinite;
}
.fruit-card:hover .glow-ring { opacity: 1; }
@keyframes rotateAngle {
  0%{--angle:0deg} 100%{--angle:360deg}
}

.fruit-emoji {
  font-size: 4rem;
  display: block;
  margin-bottom: 12px;
  filter: drop-shadow(0 0 12px var(--c1));
  animation: floaty 3s ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  position: relative; z-index: 1;
}
@keyframes floaty {
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-10px) rotate(3deg)}
}

.fruit-name {
  font-weight: 900; font-size: 1.1rem;
  color: white; margin-bottom: 4px;
  position: relative; z-index: 1;
}
.fruit-origin {
  font-size: 0.7rem; font-weight: 700;
  color: rgba(255,255,255,0.35);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.fruit-price {
  font-family: 'Righteous', cursive;
  font-size: 1.6rem;
  color: var(--c1);
  margin-bottom: 16px;
  text-shadow: 0 0 20px var(--c1);
  position: relative; z-index: 1;
  animation: pricePulse 2s ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}
@keyframes pricePulse {
  0%{text-shadow:0 0 10px var(--c1)} 100%{text-shadow:0 0 30px var(--c1),0 0 60px var(--c1)}
}

/* Qty stepper */
.qty-row {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 14px;
  position: relative; z-index: 1;
}
.qty-btn {
  background: rgba(255,255,255,0.1);
  border: none; color: white;
  width: 28px; height: 28px;
  border-radius: 50%; font-size: 1.1rem;
  cursor: pointer; transition: all 0.2s;
  display:flex;align-items:center;justify-content:center;
}
.qty-btn:hover { background: var(--c1); transform: scale(1.2); }
.qty-num {
  color: white; font-weight: 900; font-size: 1rem;
  min-width: 24px; text-align: center;
}

.add-btn {
  background: linear-gradient(135deg, var(--c1), var(--c2));
  color: #000;
  border: none;
  padding: 11px 22px;
  border-radius: 50px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.88rem; font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 20px var(--shadow);
  position: relative; z-index: 1;
  letter-spacing: 0.5px;
  overflow: hidden;
}
.add-btn:hover { transform: scale(1.1); box-shadow: 0 8px 30px var(--shadow); }
.add-btn:active { transform: scale(0.95); }

/* Particle burst */
.particle {
  position: fixed; pointer-events: none; z-index: 9000;
  font-size: 1.4rem;
  animation: burst 0.9s ease-out forwards;
}
@keyframes burst {
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3)}
}

/* Cart section */
.cart-section {
  position: relative; z-index: 10;
  max-width: 560px; margin: 40px auto 80px; padding: 0 20px;
}

.cart-box {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px;
  padding: 30px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  position: relative; overflow: hidden;
}
.cart-box::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(135deg, rgba(255,45,120,0.05), rgba(0,207,255,0.05));
  border-radius:32px; pointer-events:none;
}

.cart-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 24px;
}
.cart-title {
  font-family: 'Righteous', cursive;
  font-size: 1.8rem;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cart-badge {
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  color: white; font-weight: 900;
  padding: 6px 14px; border-radius: 50px;
  font-size: 0.85rem;
  box-shadow: 0 0 20px rgba(255,45,120,0.5);
  animation: badgePop 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes badgePop { 0%{transform:scale(0)} 100%{transform:scale(1)} }

.cart-empty-state {
  text-align: center; padding: 40px 0;
}
.cart-empty-state .big-emoji { font-size: 4rem; animation: floaty 3s ease-in-out infinite; }
.cart-empty-state p { color: rgba(255,255,255,0.25); font-weight: 700; margin-top: 12px; letter-spacing: 1px; }

#cartItems { list-style: none; max-height: 280px; overflow-y: auto; }
#cartItems::-webkit-scrollbar { width: 4px; }
#cartItems::-webkit-scrollbar-track { background: transparent; }
#cartItems::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.cart-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  animation: itemSlide 0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes itemSlide {
  0%{opacity:0;transform:translateX(-30px) scale(0.9)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}

.item-emo { font-size: 2.2rem; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
.item-info { flex: 1; }
.item-name { color: white; font-weight: 800; font-size: 0.95rem; }
.item-sub { color: rgba(255,255,255,0.35); font-size: 0.75rem; font-weight: 700; }
.item-price { color: var(--neon-yellow); font-family: 'Righteous', cursive; font-size: 1.1rem; }
.del-btn {
  background: rgba(255,45,120,0.1);
  border: 1px solid rgba(255,45,120,0.2);
  color: var(--neon-pink);
  width: 36px; height: 36px;
  border-radius: 50%; font-size: 1rem;
  cursor: pointer; transition: all 0.3s;
  display:flex;align-items:center;justify-content:center;
}
.del-btn:hover { background: var(--neon-pink); color: white; transform: rotate(90deg) scale(1.15); box-shadow: 0 0 16px var(--neon-pink); }

/* Totals & promo */
.promo-row {
  display: flex; gap: 10px; margin-top: 20px;
}
.promo-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: white; padding: 12px 16px;
  border-radius: 14px; font-family: 'Nunito', sans-serif;
  font-weight: 700; font-size: 0.9rem;
  outline: none; transition: border 0.3s;
}
.promo-input::placeholder { color: rgba(255,255,255,0.25); }
.promo-input:focus { border-color: var(--neon-green); }
.promo-apply {
  background: linear-gradient(135deg, var(--neon-green), #00b8a9);
  color: #000; border: none;
  padding: 12px 18px; border-radius: 14px;
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.85rem;
  cursor: pointer; transition: all 0.3s;
}
.promo-apply:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon-green); }

.totals-box {
  margin-top: 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px; padding: 18px 20px;
}
.totals-row {
  display: flex; justify-content: space-between;
  margin-bottom: 10px; font-size: 0.85rem;
}
.totals-row span:first-child { color: rgba(255,255,255,0.45); font-weight: 700; }
.totals-row span:last-child { color: white; font-weight: 800; }
.totals-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 12px 0; }
.grand-row {
  display: flex; justify-content: space-between; align-items: center;
}
.grand-label { color: white; font-weight: 900; font-size: 1rem; }
.grand-amount {
  font-family: 'Righteous', cursive; font-size: 2rem;
  background: linear-gradient(90deg, var(--neon-yellow), var(--neon-orange));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 12px rgba(255,230,0,0.5));
}

.checkout-btn {
  width: 100%; margin-top: 16px;
  background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 50%, var(--neon-blue) 100%);
  background-size: 200%;
  color: white; border: none;
  padding: 18px; border-radius: 20px;
  font-family: 'Righteous', cursive;
  font-size: 1.1rem; letter-spacing: 2px;
  cursor: pointer; transition: all 0.4s;
  box-shadow: 0 0 30px rgba(255,45,120,0.4);
  animation: gradShift 3s linear infinite alternate;
}
.checkout-btn:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(255,45,120,0.7); background-position: 100%; }
.checkout-btn:active { transform: scale(0.98); }
@keyframes gradShift { 0%{background-position:0%} 100%{background-position:200%} }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  padding: 14px 28px; border-radius: 50px;
  font-weight: 800; font-size: 0.92rem;
  z-index: 9999; pointer-events: none;
  white-space: nowrap;
  backdrop-filter: blur(10px);
  transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
  border: 1px solid rgba(255,255,255,0.15);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: linear-gradient(135deg,rgba(0,255,136,0.9),rgba(0,207,255,0.9)); color:#000; }
.toast.info    { background: linear-gradient(135deg,rgba(255,45,120,0.9),rgba(191,95,255,0.9)); color:#fff; }
.toast.warn    { background: linear-gradient(135deg,rgba(255,230,0,0.9),rgba(255,112,67,0.9)); color:#000; }

/* Savings chip */
.savings-chip {
  display:inline-block;
  background: linear-gradient(135deg, var(--neon-green), #00cfff);
  color: #000; font-size: 0.72rem; font-weight: 900;
  padding: 3px 10px; border-radius: 50px;
  margin-top: 4px; letter-spacing: 1px;
}

/* Rainbow divider */
.rainbow-divider {
  height: 3px;
  background: linear-gradient(90deg, #ff2d78,#ffe600,#00ff88,#00cfff,#bf5fff,#ff7043);
  background-size: 200%;
  animation: rainbowShift 2s linear infinite;
  border-radius: 3px;
  margin: 28px 0 0;
}
</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-trail" id="cursorTrail"></div>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<header>
  <div class="header-glow"></div>
  <h1>🍉 FRUITY PARADISE</h1>
  <p class="tagline">✦ Fresh · Exotic · Delicious ✦</p>
</header>

<!-- Ticker -->
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<!-- Mood filter -->
<div class="mood-bar" id="moodBar"></div>

<!-- Shop -->
<div class="shop-section">
  <div class="grid-label">🌈 Choose your fruits</div>
  <div class="fruit-grid" id="fruitGrid"></div>
</div>

<!-- Cart -->
<div class="cart-section">
  <div class="rainbow-divider"></div>
  <br>
  <div class="cart-box">
    <div class="cart-header">
      <span class="cart-title">🛒 Cart</span>
      <span class="cart-badge" id="cartBadge">0 items</span>
    </div>

    <div id="emptyState" class="cart-empty-state">
      <div class="big-emoji">🧺</div>
      <p>NO FRUITS YET — ADD SOME!</p>
    </div>

    <ul id="cartItems"></ul>

    <div id="cartBottom" style="display:none">
      <div class="promo-row">
        <input class="promo-input" id="promoInput" placeholder="🎟 Promo code...">
        <button class="promo-apply" onclick="applyPromo()">APPLY</button>
      </div>

      <div class="totals-box">
        <div class="totals-row"><span>Subtotal</span><span id="subtotalVal">$0.00</span></div>
        <div class="totals-row" id="discountRow" style="display:none">
          <span>🎉 Discount</span><span id="discountVal" style="color:var(--neon-green)"></span>
        </div>
        <div class="totals-row"><span>Delivery</span><span style="color:var(--neon-green)">FREE 🚀</span></div>
        <div class="totals-divider"></div>
        <div class="grand-row">
          <span class="grand-label">TOTAL</span>
          <span class="grand-amount">$<span id="totalVal">0.00</span></span>
        </div>
      </div>

      <button class="checkout-btn" onclick="checkout()">⚡ CHECKOUT NOW ⚡</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const fruits = [
  { name:'Apple',      emoji:'🍎', price:1.00, origin:'Washington', mood:'sweet',   c1:'#ff4757', c2:'#ff1744', shadow:'rgba(255,71,87,0.5)',   delay:'0s' },
  { name:'Banana',     emoji:'🍌', price:0.50, origin:'Ecuador',    mood:'tropical', c1:'#ffe600', c2:'#ffa502', shadow:'rgba(255,230,0,0.5)',   delay:'0.3s' },
  { name:'Orange',     emoji:'🍊', price:1.20, origin:'Valencia',   mood:'citrus',  c1:'#ff7043', c2:'#ff5722', shadow:'rgba(255,112,67,0.5)',  delay:'0.6s' },
  { name:'Grapes',     emoji:'🍇', price:2.00, origin:'Tuscany',    mood:'sweet',   c1:'#bf5fff', c2:'#8e24aa', shadow:'rgba(191,95,255,0.5)',  delay:'0.1s' },
  { name:'Mango',      emoji:'🥭', price:1.80, origin:'Alphonso',   mood:'tropical', c1:'#ffca28', c2:'#ff9800', shadow:'rgba(255,202,40,0.5)',  delay:'0.4s' },
  { name:'Watermelon', emoji:'🍉', price:3.00, origin:'Andalusia',  mood:'fresh',   c1:'#00e676', c2:'#00c853', shadow:'rgba(0,230,118,0.5)',   delay:'0.7s' },
  { name:'Strawberry', emoji:'🍓', price:2.50, origin:'California', mood:'sweet',   c1:'#ff2d78', c2:'#e91e63', shadow:'rgba(255,45,120,0.5)',  delay:'0.2s' },
  { name:'Kiwi',       emoji:'🥝', price:1.50, origin:'New Zealand',mood:'citrus',  c1:'#76ff03', c2:'#64dd17', shadow:'rgba(118,255,3,0.5)',   delay:'0.5s' },
  { name:'Pineapple',  emoji:'🍍', price:2.20, origin:'Costa Rica', mood:'tropical', c1:'#ffe600', c2:'#ffb300', shadow:'rgba(255,230,0,0.5)',   delay:'0.35s' },
  { name:'Cherry',     emoji:'🍒', price:3.50, origin:'Michigan',   mood:'sweet',   c1:'#ff1744', c2:'#d50000', shadow:'rgba(255,23,68,0.5)',   delay:'0.55s' },
];

const moods = ['all', 'sweet', 'citrus', 'tropical', 'fresh'];
let activeMood = 'all';
let cart = [];
let discountPct = 0;
let quantities = {};
fruits.forEach((_,i) => quantities[i] = 1);

// ─── STARS ──────────────────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for(let i=0;i<120;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random()*2+1;
  s.style.cssText = `
    width:${sz}px; height:${sz}px;
    top:${Math.random()*100}%;
    left:${Math.random()*100}%;
    --t:${(Math.random()*3+1).toFixed(1)}s;
    animation-delay:${(Math.random()*3).toFixed(1)}s;
  `;
  starsEl.appendChild(s);
}

// ─── CURSOR ──────────────────────────────────────────────────────────────────
const cur = document.getElementById('cursor'), trail = document.getElementById('cursorTrail');
let mx=0, my=0, tx=0, ty=0;
document.addEventListener('mousemove', e => {
  mx=e.clientX; my=e.clientY;
  cur.style.left=mx+'px'; cur.style.top=my+'px';
});
setInterval(() => {
  tx += (mx-tx)*0.18; ty += (my-ty)*0.18;
  trail.style.left=tx+'px'; trail.style.top=ty+'px';
}, 16);
document.addEventListener('mousedown', () => { cur.style.width='30px'; cur.style.height='30px'; });
document.addEventListener('mouseup',   () => { cur.style.width='20px'; cur.style.height='20px'; });

// ─── TICKER ──────────────────────────────────────────────────────────────────
const tickerEl = document.getElementById('ticker');
const items = fruits.map(f => `${f.emoji} ${f.name.toUpperCase()} — $${f.price.toFixed(2)}`);
const all = [...items,...items,...items,...items];
all.forEach(t => { const s=document.createElement('span'); s.textContent=t; tickerEl.appendChild(s); });

// ─── MOOD BAR ────────────────────────────────────────────────────────────────
const moodColors = {all:'#fff',sweet:'#ff2d78',citrus:'#ff7043',tropical:'#ffe600',fresh:'#00ff88'};
const moodBar = document.getElementById('moodBar');
moods.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'mood-btn' + (m==='all'?' active':'');
  btn.style.setProperty('--c', moodColors[m]);
  btn.textContent = {all:'🌈 ALL',sweet:'🍓 SWEET',citrus:'🍊 CITRUS',tropical:'🌴 TROPICAL',fresh:'💧 FRESH'}[m];
  btn.onclick = () => {
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeMood = m;
    renderGrid();
  };
  moodBar.appendChild(btn);
});

// ─── GRID ────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('fruitGrid');
  grid.innerHTML = '';
  const list = activeMood==='all' ? fruits : fruits.filter(f=>f.mood===activeMood);
  list.forEach((f, ri) => {
    const fi = fruits.indexOf(f);
    const card = document.createElement('div');
    card.className = 'fruit-card';
    card.style.cssText = `--c1:${f.c1};--c2:${f.c2};--shadow:${f.shadow};--delay:${f.delay};animation-delay:${ri*0.06}s`;
    card.innerHTML = `
      <div class="glow-ring"></div>
      <span class="fruit-emoji" style="--delay:${f.delay}">${f.emoji}</span>
      <div class="fruit-name">${f.name}</div>
      <div class="fruit-origin">${f.origin}</div>
      <div class="fruit-price">$${f.price.toFixed(2)}</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(${fi},-1,event)">−</button>
        <span class="qty-num" id="qty-${fi}">${quantities[fi]}</span>
        <button class="qty-btn" onclick="changeQty(${fi},1,event)">+</button>
      </div>
      <button class="add-btn" onclick="addToCart(${fi},event)">🛒 ADD TO CART</button>
    `;
    grid.appendChild(card);
  });
}
renderGrid();

function changeQty(fi, delta, e) {
  e.stopPropagation();
  quantities[fi] = Math.max(1, (quantities[fi]||1) + delta);
  const el = document.getElementById('qty-'+fi);
  if(el) el.textContent = quantities[fi];
}

// ─── ADD TO CART ──────────────────────────────────────────────────────────────
function addToCart(fi, e) {
  const f = fruits[fi];
  const qty = quantities[fi] || 1;
  for(let i=0;i<qty;i++) cart.push({ ...f, id: Date.now()+Math.random() });
  quantities[fi] = 1;
  const el = document.getElementById('qty-'+fi);
  if(el) el.textContent = 1;

  // Particle burst
  for(let i=0;i<8;i++) spawnParticle(f.emoji, e.clientX, e.clientY);

  renderCart();
  showToast(`${f.emoji} ${qty > 1 ? qty+'× ' : ''}${f.name} added!`, 'success');
}

function spawnParticle(emoji, x, y) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = emoji;
  const angle = Math.random()*Math.PI*2;
  const dist = 60 + Math.random()*80;
  p.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist - 40}px;`;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

// ─── RENDER CART ──────────────────────────────────────────────────────────────
function renderCart() {
  const ul = document.getElementById('cartItems');
  const empty = document.getElementById('emptyState');
  const bottom = document.getElementById('cartBottom');
  const badge = document.getElementById('cartBadge');

  badge.textContent = cart.length + ' item' + (cart.length!==1?'s':'');

  if(cart.length === 0) {
    empty.style.display = 'block';
    bottom.style.display = 'none';
    ul.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  bottom.style.display = 'block';
  ul.innerHTML = '';

  // Group same items
  const grouped = {};
  cart.forEach(item => {
    if(!grouped[item.name]) grouped[item.name] = { ...item, count:0 };
    grouped[item.name].count++;
  });

  Object.values(grouped).forEach(g => {
    const li = document.createElement('li');
    li.className = 'cart-item';
    const lineTotal = (g.price * g.count).toFixed(2);
    li.innerHTML = `
      <span class="item-emo">${g.emoji}</span>
      <div class="item-info">
        <div class="item-name">${g.name} ${g.count>1?`<span class="savings-chip">×${g.count}</span>`:''}</div>
        <div class="item-sub">$${g.price.toFixed(2)} each</div>
      </div>
      <span class="item-price">$${lineTotal}</span>
      <button class="del-btn" onclick="removeOne('${g.name}')">✕</button>
    `;
    ul.appendChild(li);
  });

  updateTotals();
}

function removeOne(name) {
  const idx = cart.findLastIndex ? cart.findLastIndex(i=>i.name===name) : (() => {
    for(let i=cart.length-1;i>=0;i--) if(cart[i].name===name) return i;
    return -1;
  })();
  if(idx > -1) cart.splice(idx, 1);
  renderCart();
}

function updateTotals() {
  const sub = cart.reduce((s,i)=>s+i.price, 0);
  const disc = sub * discountPct;
  const total = sub - disc;
  document.getElementById('subtotalVal').textContent = '$'+sub.toFixed(2);
  document.getElementById('totalVal').textContent = total.toFixed(2);
  const drow = document.getElementById('discountRow');
  const dval = document.getElementById('discountVal');
  if(discountPct > 0) { drow.style.display='flex'; dval.textContent='-$'+disc.toFixed(2); }
  else { drow.style.display='none'; }
}

// ─── PROMO ────────────────────────────────────────────────────────────────────
function applyPromo() {
  const code = document.getElementById('promoInput').value.trim().toUpperCase();
  const codes = { FRUITY20: 0.20, FRESH10: 0.10, PARADISE: 0.15 };
  if(codes[code]) {
    discountPct = codes[code];
    updateTotals();
    showToast(`🎉 ${(discountPct*100)|0}% discount applied!`, 'success');
  } else {
    showToast('❌ Invalid promo code', 'warn');
  }
}

// ─── CHECKOUT ─────────────────────────────────────────────────────────────────
function checkout() {
  if(cart.length===0){ showToast('🛒 Your cart is empty!','warn'); return; }
  const sub = cart.reduce((s,i)=>s+i.price,0);
  const total = sub*(1-discountPct);
  // Big celebration
  for(let i=0;i<20;i++) {
    setTimeout(()=>{
      const e = fruits[Math.floor(Math.random()*fruits.length)];
      spawnParticle(e.emoji, Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.5);
    }, i*60);
  }
  showToast(`🎊 Order placed! $${total.toFixed(2)} — Thank you!`, 'success');
  cart = []; discountPct = 0;
  document.getElementById('promoInput').value = '';
  renderCart();
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
